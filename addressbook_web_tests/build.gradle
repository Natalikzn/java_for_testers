plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.50.0'
    implementation("com.beust:jcommander:1.82")
    implementation("com.fasterxml.jackson.core:jackson-databind:2.17.0")
    implementation("com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.14.2")
    implementation("tools.jackson.dataformat:jackson-dataformat-xml:3.0.0")
    implementation("com.mysql:mysql-connector-j:26.10.0")
    implementation("org.hibernate.orm:hibernate-core:6.6.0.Final")
}

test {
    useJUnitPlatform()
    if (project.hasProperty("browser")){
        systemProperty("browser", project.property("browser"));
    }

    if (project.hasProperty("target")){
        systemProperty("target", project.property("target"));
    }
}